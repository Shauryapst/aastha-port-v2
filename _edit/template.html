<style>
/* =========================================================
   The 45 Canva pages as cards on a cream table, with motion.
   Rule for every animation here: a page is NEVER hidden and
   its image is NEVER held back — motion only moves/scales it.
   ========================================================= */
:root{
  --bg:#efe8d8; --ink:#1f2b2a; --muted:#6b726f;
  --teal:#2f6e70; --teal-deep:#163b3c; --cream:#f2ebdc;
  --chrome:#ffffff;
  --font-display:"Italiana","Times New Roman",serif;
  --font-ui:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --pad:max(20px,env(safe-area-inset-left,0px));
  --gx:clamp(16px,4.5vw,76px);      /* space left/right of the pages */
  --gap:clamp(22px,3.4vw,56px);     /* space between pages */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html.loading,html.loading body,html.ix-open,html.ix-open body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- pages (cards) ---------- */
#stack{width:min(100%,calc((100vh - 170px) * 7015 / 2480 + 2 * var(--gx)));margin:0 auto;
  padding:clamp(76px,9vh,96px) var(--gx) 0;display:flex;flex-direction:column;gap:var(--gap)}
.pg{position:relative;margin:0;line-height:0}
.frame{position:relative;width:100%;aspect-ratio:7015/2480;overflow:hidden;border-radius:6px;background:#e4dccb;
  box-shadow:0 1px 0 rgba(31,43,42,.06),0 34px 60px -42px rgba(31,43,42,.55);transform-origin:50% 50%;will-change:transform}
.art{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.art img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:fill;max-width:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;color:transparent}
.hot{position:absolute;z-index:2;display:block;border-radius:6px}
.hot::after{content:"";position:absolute;left:0;right:0;bottom:4%;height:2px;background:var(--cream);
  transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.hot:hover::after,.hot:focus-visible::after{transform:scaleX(1)}
/* thank-you page: the contact lines underline themselves one after another */
#p45.finale .hot::after{transform:scaleX(1)}
#p45 .hot:nth-of-type(1)::after{transition-delay:.35s}
#p45 .hot:nth-of-type(2)::after{transition-delay:.8s}
#p45.finale .hot:hover::after{transition-delay:0s}

/* end of the stack: back to top */
.end{display:flex;justify-content:center;padding:clamp(44px,7vh,80px) 0 clamp(90px,14vh,140px)}
#totop{appearance:none;background:none;border:1.5px solid var(--ink);border-radius:999px;padding:14px 26px;display:flex;align-items:center;gap:10px;
  font:500 12px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
  opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease) .5s,transform 1s var(--ease) .5s,background .3s,color .3s}
#totop.show{opacity:1;transform:none}
#totop:hover{background:var(--ink);color:var(--bg)}
#totop svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;transition:transform .5s var(--ease)}
#totop:hover svg{transform:translateY(-3px)}

/* phones and tablets held upright: each page is a full-height card — swipe sideways to read it */
html.portrait{scroll-snap-type:y proximity}
.portrait #stack{width:auto;padding:0;gap:0;display:block}
.portrait .pg{height:100vh;height:100dvh;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-align:start;overscroll-behavior-x:contain;padding:8px 0 0 14px}
.portrait .pg::-webkit-scrollbar{display:none}
.portrait .pg::after{content:"";flex:0 0 14px;height:1px}
.portrait .frame{flex:0 0 auto;width:auto;height:calc(100dvh - 150px);height:calc(100vh - 150px);aspect-ratio:7015/2480}
@supports (height:100dvh){.portrait .frame{height:calc(100dvh - 150px)}}
.portrait .end{height:60vh;align-items:center;scroll-snap-align:end;padding:0}

/* ---------- loader: name writes itself, then the screen splits open ---------- */
#loader{position:fixed;inset:0;z-index:300;color:var(--ink)}
.l-half{position:absolute;left:0;right:0;height:50.5%;background:var(--bg);transition:transform 1.15s cubic-bezier(.77,0,.18,1) .15s}
.l-half.top{top:0}.l-half.bot{bottom:0}
#loader.out .l-half.top{transform:translateY(-101%)}
#loader.out .l-half.bot{transform:translateY(101%)}
#loader.out{pointer-events:none}
.l-content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:calc(22px + env(safe-area-inset-top,0px)) var(--pad) calc(24px + env(safe-area-inset-bottom,0px));transition:opacity .45s,transform .7s var(--ease)}
#loader.out .l-content{opacity:0;transform:scale(.97)}
.l-top,.l-bot{display:flex;justify-content:space-between;gap:16px}
.l-top{font:500 12px/1.4 var(--font-ui);letter-spacing:.14em;text-transform:uppercase}
.l-top .acc{color:var(--teal)}
.l-bot{align-items:flex-end;flex-wrap:wrap}
.l-name{margin:0;font:400 clamp(52px,11vw,190px)/1 var(--font-display);letter-spacing:.01em;opacity:0}
.l-name.split{opacity:1}
.l-name .c{display:inline-block;opacity:0;transform:translateY(45%) rotate(5deg);filter:blur(6px);
  animation:letter .95s var(--ease) forwards;animation-delay:calc(var(--i) * 55ms + 120ms)}
@keyframes letter{to{opacity:1;transform:none;filter:blur(0)}}
.l-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.l-count{font:400 clamp(40px,7vw,110px)/.9 var(--font-display);font-variant-numeric:tabular-nums}
.l-note{font:500 12px/1.5 var(--font-ui);color:var(--muted);max-width:26ch;text-align:right}
.l-line{position:absolute;left:0;bottom:0;height:3px;background:var(--teal);width:0;transition:width .4s var(--ease)}

/* ---------- floating chrome ---------- */
.chrome,.chrome-b,.rail,#bar,.hint,#chflash{mix-blend-mode:difference;color:var(--chrome)}
.chrome{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(18px + env(safe-area-inset-top,0px)) var(--pad) 0;pointer-events:none}
.chrome>*,.chrome-b>*{pointer-events:auto}
.brand{font:400 clamp(22px,2.1vw,30px)/1 var(--font-display);letter-spacing:.02em;color:inherit;text-decoration:none}
.tr{display:flex;align-items:center;gap:24px}
.count{font:500 12px/1 var(--font-ui);letter-spacing:.08em;font-variant-numeric:tabular-nums;display:flex;gap:5px}
.count i{font-style:normal;opacity:.55}
.ibtn{appearance:none;background:none;border:0;padding:6px 0 6px 6px;display:flex;align-items:center;gap:10px;
  font:500 12px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.dots{display:grid;grid-template-columns:repeat(2,5px);gap:3px;transition:transform .6s var(--ease)}
.dots i{width:5px;height:5px;background:currentColor;border-radius:50%}
.ibtn:hover .dots{transform:rotate(90deg)}
.chrome-b{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  padding:0 var(--pad) calc(18px + env(safe-area-inset-bottom,0px));pointer-events:none}
.pgmeta{display:flex;align-items:baseline;gap:16px;min-width:0}
.roll{position:relative;display:block;overflow:hidden;white-space:nowrap}
.roll .r{display:block;transition:transform .7s var(--ease)}
.roll .r.leave{position:absolute;left:0;top:0}
.chn{font:400 clamp(20px,1.9vw,26px)/1.35 var(--font-display);height:1.35em}
.ptt{font:500 12px/1.9 var(--font-ui);letter-spacing:.06em;height:1.9em}
.nav{display:flex;gap:10px}
.nb{appearance:none;background:none;width:40px;height:40px;border:1.5px solid currentColor;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;transition:transform .5s var(--ease)}
.nb:hover{transform:scale(1.12)}
.nb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
#bar{position:fixed;left:0;top:0;right:0;height:2px;background:var(--chrome);transform:scaleX(0);transform-origin:left;z-index:60;pointer-events:none}
.hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  display:flex;flex-direction:column;align-items:center;gap:8px;font:500 11px/1 var(--font-ui);letter-spacing:.16em;text-transform:uppercase;
  pointer-events:none;transition:opacity .6s}
.hint b{display:block;width:1px;height:34px;background:currentColor;transform-origin:top;animation:drip 2s var(--ease) infinite}
@keyframes drip{0%{transform:scaleY(0)}55%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.hint.gone{opacity:0}

/* project name flash — shows for a moment when you enter a new project */
#chflash{position:fixed;inset:0;z-index:45;display:grid;place-content:center;text-align:center;pointer-events:none;opacity:0}
#chflash .cf-num{display:block;font:500 12px/1 var(--font-ui);letter-spacing:.24em;margin-bottom:18px}
#chflash h2{margin:0;font:400 clamp(56px,10vw,170px)/.9 var(--font-display);letter-spacing:.02em}
#chflash p{margin:16px 0 0;font:500 13px/1.4 var(--font-ui);letter-spacing:.08em}
#chflash.on{animation:cf 1.7s var(--ease) forwards}
#chflash.on h2{animation:cft 1.7s var(--ease) forwards}
@keyframes cf{0%{opacity:0}18%{opacity:1}68%{opacity:1}100%{opacity:0}}
@keyframes cft{0%{letter-spacing:.3em;filter:blur(8px);transform:scale(1.06)}30%{letter-spacing:.02em;filter:blur(0);transform:none}100%{transform:scale(.98)}}

/* page rail (desktop) */
.rail{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:50;display:flex;flex-direction:column;align-items:flex-end}
.tick{appearance:none;background:none;border:0;padding:0;display:block;height:9px;width:56px;position:relative;cursor:pointer}
.tick::before{content:"";position:absolute;right:0;top:50%;height:2px;margin-top:-1px;width:8px;background:currentColor;opacity:.45;
  transition:width .4s var(--ease),opacity .3s}
.tick.cs{margin-top:9px}
.tick.cs::before{width:14px}
.tick:hover::before{opacity:1}
.tick.on::before{opacity:1;width:26px}
.rail .tip{position:absolute;right:62px;top:0;transform:translateY(-50%);font:500 12px/1 var(--font-ui);letter-spacing:.04em;white-space:nowrap;
  opacity:0;transition:opacity .25s;pointer-events:none}
.rail .tip.on{opacity:1}
@media (max-height:600px),(max-width:800px){.rail{display:none}}
.portrait .rail,.portrait .hint{display:none}

/* ---------- index overlay ---------- */
#ix{position:fixed;inset:0;z-index:200;background:var(--teal-deep);color:var(--cream);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(20px + env(safe-area-inset-top,0px)) var(--pad) calc(48px + env(safe-area-inset-bottom,0px));
  clip-path:circle(0px at var(--cx,95%) var(--cy,40px));transition:clip-path .9s var(--ease);visibility:hidden}
#ix.open{clip-path:circle(150vmax at var(--cx,95%) var(--cy,40px));visibility:visible}
#ix.closing{visibility:visible}
.ix-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:clamp(20px,4vw,48px)}
.ix-top h2{margin:0;font:400 clamp(56px,10vw,150px)/.85 var(--font-display)}
.ix-close{appearance:none;background:none;border:1.5px solid currentColor;border-radius:999px;padding:11px 18px;
  font:500 12px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .3s,color .3s}
.ix-close:hover{background:var(--cream);color:var(--teal-deep)}
.ix-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:30px 26px}
.ix-item{appearance:none;background:none;border:0;padding:0;text-align:left;cursor:pointer;width:100%;display:flex;flex-direction:column;gap:12px}
.ix-thumb{position:relative;display:block;aspect-ratio:19/10;overflow:hidden;border-radius:6px;background:#24494a;
  transform:perspective(900px);transition:transform .7s var(--ease),box-shadow .7s var(--ease);will-change:transform}
.ix-thumb.tilting{transition:transform .12s linear,box-shadow .4s var(--ease);box-shadow:0 30px 50px -28px rgba(0,0,0,.6)}
.ix-thumb img{width:100%;height:100%;display:block;object-fit:cover;object-position:var(--ox,100%) 50%}
.ix-thumb::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),rgba(255,255,255,.26),rgba(255,255,255,0) 55%);opacity:0;transition:opacity .4s}
.ix-thumb.tilting::after{opacity:1}
.ix-text{display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:baseline}
.ix-num{font:500 12px/1 var(--font-ui);letter-spacing:.08em;opacity:.6;font-variant-numeric:tabular-nums}
.ix-title{font:400 clamp(28px,2.6vw,40px)/1 var(--font-display)}
.ix-sub{grid-column:2;font:400 13px/1.5 var(--font-ui);opacity:.7;margin-top:4px}
.ix-links{display:flex;flex-wrap:wrap;gap:10px;margin-top:clamp(36px,5vw,64px);padding-top:28px;border-top:1px solid rgba(242,235,220,.16)}
.ix-links a{color:inherit;text-decoration:none;border:1px solid rgba(242,235,220,.4);border-radius:999px;padding:10px 18px;font-size:14px;transition:background .25s,color .25s}
.ix-links a:hover{background:var(--cream);color:var(--teal-deep)}
.js .ix-list li{opacity:0;transform:translateY(26px)}
#ix.open .ix-list li{opacity:1;transform:none;transition:opacity .8s var(--ease) calc(.15s + var(--d,0s)),transform .9s var(--ease) calc(.15s + var(--d,0s))}

/* ---------- cursor + magnifier ---------- */
.fine,.fine *{cursor:none!important}
#cdot,#cring,#loupe{position:fixed;left:0;top:0;pointer-events:none;opacity:0;will-change:transform}
#cdot{width:8px;height:8px;border-radius:50%;background:#fff;mix-blend-mode:difference;z-index:400;transition:opacity .25s}
#cring{--rs:40px;width:var(--rs);height:var(--rs);border-radius:50%;border:1.5px solid #fff;mix-blend-mode:difference;z-index:399;
  display:grid;place-items:center;transition:width .5s var(--ease),height .5s var(--ease),opacity .3s,border-radius .4s}
#cring span{font:500 10px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;opacity:0;transition:opacity .3s}
#cring.lbl span{opacity:1}
#cdot.on,#cring.on{opacity:1}
#cring.hide{opacity:0!important}
#loupe{--size:290px;width:var(--size);height:var(--size);border-radius:50%;z-index:398;background-color:var(--bg);background-repeat:no-repeat;
  box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.12),0 28px 70px rgba(0,0,0,.42)}
#loupe::after{content:attr(data-z);position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:500 10px/1 var(--font-ui);letter-spacing:.12em;
  color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:99px;opacity:0;transition:opacity .3s}
#loupe.zshow::after{opacity:1}
.coarse #loupe{--size:200px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);max-width:calc(100vw - 32px);
  opacity:0;z-index:500;background:var(--teal-deep);color:var(--cream);padding:11px 16px;border-radius:8px;font:500 13px/1.4 var(--font-ui);
  transition:opacity .35s,transform .5s var(--ease);pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}


/* ---------- process scenes (pinned, scrubbed by scroll) ---------- */
.scene{position:relative;height:310vh;width:100vw;margin:calc(var(--gap) * .4) 0 calc(var(--gap) * .4) calc(50% - 50vw);
  background:var(--teal-deep);color:var(--cream)}
.sc-pin{position:sticky;top:0;height:100vh;height:100svh;display:grid;grid-template-columns:minmax(250px,.9fr) 2.6fr;
  gap:clamp(20px,3.4vw,64px);align-items:center;padding:clamp(72px,10vh,104px) var(--gx) clamp(72px,10vh,96px);overflow:hidden}
.sc-pin,.studio{background:var(--teal-deep) url("img/bg/watercolour-dark.webp") center/cover no-repeat}
.sc-pin::before,.studio::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(18,47,48,.72) 0%,rgba(18,47,48,.28) 38%,rgba(18,47,48,.1) 100%)}
.studio{position:relative}
.studio>*{position:relative}
.sc-cap{position:relative;align-self:center}
.sc-kick{font:500 12px/1 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;opacity:.7}
.sc-title{font:400 clamp(40px,4.4vw,74px)/.95 var(--font-display);margin:14px 0 14px}
.sc-sub{font:400 15px/1.55 var(--font-ui);opacity:.78;max-width:34ch;margin:0 0 28px}
.sc-steps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.sc-steps li{display:grid;grid-template-columns:30px 1fr;column-gap:10px;opacity:.36;transition:opacity .45s,transform .6s var(--ease)}
.sc-steps li b{font:500 11px/1.9 var(--font-ui);letter-spacing:.1em}
.sc-steps li span{font:400 22px/1.2 var(--font-display)}
.sc-steps li em{grid-column:2;font:400 13px/1.45 var(--font-ui);font-style:normal;opacity:.78;max-height:0;overflow:hidden;transition:max-height .6s var(--ease)}
.sc-steps li.on{opacity:1;transform:translateX(8px)}
.sc-steps li.on em{max-height:4.5em}
.sc-steps li.done{opacity:.6}
.sc-bar{height:2px;background:rgba(242,235,220,.18);margin:26px 0 14px;max-width:280px}
.sc-bar i{display:block;height:100%;background:var(--cream);transform-origin:left;transform:scaleX(0)}
.sc-spec{font:500 12px/1.5 var(--font-ui);letter-spacing:.06em;opacity:.6;margin:0;max-width:36ch}
.sc-stage{position:relative;height:100%;min-height:0;min-width:0;overflow:hidden;border-radius:10px}
.mb-note-text .w{opacity:0}
.sc-stage canvas{position:absolute;inset:0;display:block}

/* moodboard */
.mb{position:absolute;inset:0;display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(18px,3vw,52px);align-items:center}
.mb-collage{position:relative;height:min(100%,600px);aspect-ratio:1/.95;max-width:100%;justify-self:center}
.mb-piece{position:absolute;margin:0;opacity:0;will-change:transform;box-shadow:0 22px 44px -20px rgba(0,0,0,.65)}
.mb-piece img{display:block;width:100%;height:auto}
.mb-info{display:flex;flex-direction:column;gap:24px;max-width:460px}
.mb-pal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.mb-chip{display:flex;flex-direction:column;gap:7px}
.mb-chip i{display:block;aspect-ratio:1/.78;background:var(--c);border-radius:3px;transform:scaleY(var(--t,0));transform-origin:bottom;box-shadow:0 10px 22px -14px rgba(0,0,0,.7)}
.mb-chip small{font:500 10px/1 var(--font-ui);letter-spacing:.06em;opacity:var(--t,0)}
.mb-words{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0;font:400 clamp(20px,1.8vw,26px)/1.15 var(--font-display)}
.mb-word{display:inline-block;opacity:0}
.mb-note h3{font:500 11px/1 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;margin:0 0 10px;opacity:0}
.mb-note-text{font:400 clamp(13px,1.05vw,15px)/1.62 var(--font-ui);margin:0}

/* scenes on phones and narrow screens: caption on top, stage below */
@media (max-width:860px),(max-aspect-ratio:1/1){
  .scene{height:260vh}
  .sc-pin{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:14px;align-items:stretch;padding:68px 16px 74px}
  .sc-title{font-size:clamp(30px,8vw,44px);margin:8px 0 8px}
  .sc-sub,.sc-spec{display:none}
  .sc-steps{display:block;min-height:3.2em}
  .sc-steps li{display:none}
  .sc-steps li.on{display:grid;transform:none}
  .sc-steps li span{font-size:19px}
  .sc-bar{margin:10px 0 0;max-width:none}
  .mb{grid-template-columns:1fr;grid-template-rows:1fr auto;gap:12px;align-items:stretch}
  .mb-collage{height:100%;max-height:none;aspect-ratio:1/.95;justify-self:center;min-height:0}
  .mb-info{gap:10px;max-width:none}
  .mb-pal{grid-template-columns:repeat(8,1fr);gap:5px}
  .mb-chip small{display:none}
  .mb-words{font-size:16px;gap:2px 10px}
  .mb-note h3{display:none}
  .mb-note-text{font-size:12px;line-height:1.5}
}

/* ---------- case studies (plain text, always visible) ---------- */
.case{padding:clamp(18px,2.4vw,34px) clamp(4px,1vw,12px) clamp(6px,1vw,12px);border-top:1px solid rgba(31,43,42,.16);color:var(--ink)}
.case-kick{margin:0 0 18px;font:500 11px/1 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;color:var(--teal)}
.case-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,3vw,48px)}
.case h3{margin:0 0 8px;font:400 clamp(22px,2vw,28px)/1 var(--font-display)}
.case p{margin:0;font:400 clamp(14px,1.05vw,16px)/1.6 var(--font-ui);color:#3b4644}
.case .case-tags{margin-top:18px;font:500 12px/1.5 var(--font-ui);letter-spacing:.04em;color:var(--muted)}
@media (max-width:760px){.case-grid{grid-template-columns:1fr;gap:16px}}
.portrait .case{padding:28px 18px 34px}

/* ---------- colourway studio ---------- */
.studio{--ground:#f8b931;position:relative;width:100vw;margin:calc(var(--gap) * .4) 0 calc(var(--gap) * .4) calc(50% - 50vw);
  min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(250px,.9fr) 2.6fr;gap:clamp(20px,3.4vw,64px);align-items:center;
  padding:clamp(72px,10vh,104px) var(--gx);background:var(--teal-deep);color:var(--cream)}
.st-ways{display:grid;gap:8px;margin:0 0 22px}
.st-way{appearance:none;display:flex;align-items:center;gap:14px;background:rgba(242,235,220,.05);border:1px solid rgba(242,235,220,.18);
  border-radius:999px;padding:9px 16px 9px 10px;cursor:pointer;text-align:left;transition:background .3s,border-color .3s,transform .4s var(--ease)}
.st-way:hover{background:rgba(242,235,220,.12);transform:translateX(4px)}
.st-way[aria-pressed="true"]{background:var(--cream);color:var(--teal-deep);border-color:var(--cream)}
.st-dots{display:flex}
.st-dots i{width:20px;height:20px;border-radius:50%;margin-right:-6px;box-shadow:0 0 0 2px var(--teal-deep)}
.st-way[aria-pressed="true"] .st-dots i{box-shadow:0 0 0 2px var(--cream)}
.st-wname{margin-left:8px;font:400 19px/1.1 var(--font-display)}
.st-stage{position:relative;height:min(78vh,760px);border-radius:10px;overflow:hidden;background:var(--ground);transition:background .6s;box-shadow:0 40px 80px -50px rgba(0,0,0,.8)}
.st-stage canvas{position:absolute;inset:0;display:block}
.st-name{position:absolute;left:16px;bottom:16px;z-index:2;background:rgba(251,248,241,.94);color:var(--teal-deep);border-radius:999px;padding:8px 14px;
  font:500 12px/1 var(--font-ui);letter-spacing:.08em}
.st-name:empty{display:none}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .studio{grid-template-columns:1fr;align-items:start;gap:16px;padding:72px 16px 80px}
  .studio .sc-sub,.studio .sc-spec{display:block}
  .st-ways{grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
  .st-wname{font-size:15px}
  .st-stage{height:58vh}

/* ---------- print libraries & the shoot (separate images) ---------- */
.lib{position:relative;padding:clamp(34px,4vw,60px) clamp(4px,1vw,12px) clamp(20px,3vw,40px)}
.lib::before{content:"";position:absolute;inset:0 calc(50% - 50vw);z-index:-1;pointer-events:none;
  background:url("img/bg/watercolour.webp") center/cover no-repeat;opacity:.16}
.lib-head{display:grid;grid-template-columns:auto 1fr;column-gap:24px;align-items:baseline;margin-bottom:clamp(20px,2.6vw,36px)}
.lib-head .sc-kick{grid-column:1/-1;color:var(--teal);opacity:1}
.lib-title{margin:10px 0 0;font:400 clamp(36px,4vw,64px)/1 var(--font-display)}
.lib-sub{margin:0;max-width:52ch;font:400 15px/1.55 var(--font-ui);color:#3b4644;align-self:end}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:clamp(14px,1.8vw,26px)}
.lib--shoot .lib-grid{grid-template-columns:repeat(4,1fr)}
.lib-card{margin:0;display:flex;flex-direction:column;gap:9px}
.lib-open{appearance:none;border:0;padding:0;background:#fbf8f1;cursor:pointer;display:block;border-radius:4px;overflow:hidden;
  box-shadow:0 1px 0 rgba(31,43,42,.08),0 24px 40px -28px rgba(31,43,42,.6);transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
.lib-open img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;transition:transform 1.2s var(--ease)}
.lib--shoot .lib-open img{aspect-ratio:3/4;object-position:50% 20%}
.lib-open:hover{transform:translateY(-6px) rotate(-.6deg);box-shadow:0 1px 0 rgba(31,43,42,.08),0 40px 50px -30px rgba(31,43,42,.7)}
.lib-open:hover img{transform:scale(1.06)}
.lib-card figcaption{font:500 11px/1.3 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.lib-head{grid-template-columns:1fr}.lib-sub{margin-top:8px}.lib-grid{grid-template-columns:1fr 1fr;gap:12px}.lib--shoot .lib-grid{grid-template-columns:1fr 1fr}}
.portrait .lib{padding:76px 16px 30px}

/* large view: the image follows the pointer at 2.2× */
#lbx{position:fixed;inset:0;z-index:260;display:grid;place-items:center;background:rgba(14,32,33,.94);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#lbx.on{opacity:1;pointer-events:auto}
.lbx-frame{position:relative;max-width:min(88vw,1100px);max-height:82vh;overflow:hidden;border-radius:6px;box-shadow:0 40px 90px rgba(0,0,0,.55);
  transform:scale(.94);transition:transform .6s var(--ease)}
#lbx.on .lbx-frame{transform:none}
.lbx-frame img{display:block;max-width:min(88vw,1100px);max-height:82vh;width:auto;height:auto;transition:transform .35s var(--ease);transform-origin:var(--ox,50%) var(--oy,50%)}
.lbx-frame.zoom img{transform:scale(2.2)}
.lbx-cap{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);color:var(--cream);font:500 12px/1 var(--font-ui);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.lbx-close{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));right:var(--pad);appearance:none;background:none;border:1.5px solid var(--cream);color:var(--cream);
  border-radius:999px;padding:10px 16px;font:500 12px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;cursor:pointer}

/* ---------- contents page: stamps drop in and get postmarked ---------- */
.pg-toc .frame{container-type:inline-size;background:#f6f2ea url("img/toc/paper.webp") 0 0/32cqw auto repeat}
.pg-toc .art{display:grid;grid-template-columns:13cqw 1fr;align-items:center;padding:2.6cqw 6cqw 2.6cqw 4cqw;line-height:normal}
.toc-word{margin:0;display:flex;flex-direction:column;align-items:center;font:400 3.2cqw/1 "Archivo Black","Arial Black",sans-serif;color:#111;letter-spacing:0}
.toc-word span{display:block}
.toc-note{position:absolute;right:6cqw;bottom:2.4cqw;margin:0;font:500 .78cqw/1 var(--font-ui);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.toc-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,9.4cqw);gap:2cqw 1.6cqw;justify-content:start;align-content:center}
.toc-list li{position:relative}
.stamp{display:block;position:relative;width:9.4cqw;color:var(--ink);text-decoration:none;transform:rotate(var(--r));transition:transform .6s var(--ease)}
.stamp-img{display:block;transition:transform .6s var(--ease),filter .6s var(--ease);filter:drop-shadow(0 .45cqw .7cqw rgba(31,43,42,.3))}
.pg-toc .art img{position:static;inset:auto;display:block;width:100%;height:auto;max-width:100%;object-fit:contain}
.postmark{position:absolute;width:5.6cqw;height:5.6cqw;right:-1.6cqw;top:-1.8cqw;fill:none;stroke:#23407a;stroke-width:2.4;opacity:.78;
  transform:rotate(-14deg);mix-blend-mode:multiply;pointer-events:none}
.postmark text{fill:#23407a;stroke:none;font:600 9px var(--font-ui);letter-spacing:1.6px}
.postmark .pm-n{font:400 30px var(--font-display);letter-spacing:0}
.stamp-meta{display:grid;grid-template-columns:auto 1fr;column-gap:.7cqw;align-items:baseline;margin-top:1cqw}
.stamp-meta b{font:600 .8cqw/1 var(--font-ui);letter-spacing:.08em;color:var(--teal)}
.stamp-name{font:400 1.3cqw/1.08 var(--font-display)}
.stamp-meta em{grid-column:2;font:400 .74cqw/1.35 var(--font-ui);font-style:normal;color:var(--muted);margin-top:.3cqw;opacity:.75;transform:none;transition:opacity .4s,transform .5s var(--ease)}
.stamp:hover,.stamp:focus-visible{transform:rotate(0deg) translateY(-.8cqw)}
.stamp:hover .stamp-img,.stamp:focus-visible .stamp-img{transform:scale(1.07);filter:drop-shadow(0 1.4cqw 1.6cqw rgba(31,43,42,.35))}
.stamp:hover em,.stamp:focus-visible em{opacity:1;transform:none}
.toc-list:hover .stamp:not(:hover) .stamp-img{filter:drop-shadow(0 .45cqw .7cqw rgba(31,43,42,.3)) saturate(.55) opacity(.75)}

/* the entrance — only once the page is on screen; reduced motion skips it */
html.js:not(.reduced) .pg-toc:not(.play) .toc-word span,
html.js:not(.reduced) .pg-toc:not(.play) .toc-list li,
html.js:not(.reduced) .pg-toc:not(.play) .postmark{opacity:0}
.pg-toc.play .toc-word span{animation:tocLetter .8s cubic-bezier(.2,1.45,.35,1) calc(var(--j) * 70ms) both}
.pg-toc.play .toc-list li{animation:tocDrop 1s cubic-bezier(.18,1.25,.35,1) calc(var(--i) * 130ms + .45s) both}
.pg-toc.play .postmark{animation:tocMark .45s cubic-bezier(.3,1.6,.5,1) calc(var(--i) * 130ms + 1.25s) both}
.pg-toc.play .stamp-img{animation:tocThud .5s ease-out calc(var(--i) * 130ms + 1.2s) both}
@keyframes tocLetter{0%{opacity:0;transform:translateY(-140%) rotate(-18deg)}100%{opacity:1;transform:none}}
@keyframes tocDrop{0%{opacity:0;transform:translate(6cqw,-34cqw) rotate(calc(var(--r) * 7)) scale(1.4)}55%{opacity:1}100%{opacity:1;transform:none}}
@keyframes tocMark{0%{opacity:0;transform:rotate(18deg) scale(2.1)}100%{opacity:.78;transform:rotate(-14deg) scale(1)}}
@keyframes tocThud{0%{transform:scale(1.04)}40%{transform:scale(.97)}100%{transform:none}}

/* phones held upright: a vertical album instead of a wide slide */
.portrait .pg-toc{height:auto;min-height:100vh;min-height:100dvh;display:block;overflow:visible;padding:0}
.portrait .pg-toc .frame{width:100%;height:auto;min-height:100dvh;aspect-ratio:auto}
.portrait .pg-toc .art{position:relative;display:block;padding:84px 22px 60px}
.portrait .toc-word{flex-direction:row;justify-content:center;gap:1.5cqw;font-size:10cqw;margin-bottom:6cqw}
.portrait .toc-list{grid-template-columns:repeat(2,1fr);gap:9cqw 6cqw;justify-items:center}
.portrait .stamp{width:36cqw}
.portrait .postmark{width:20cqw;height:20cqw;right:-6cqw;top:-6cqw}
.portrait .stamp-meta{margin-top:2.6cqw}
.portrait .stamp-meta b{font-size:2.8cqw}.portrait .stamp-name{font-size:5cqw}.portrait .stamp-meta em{font-size:2.9cqw;opacity:1;transform:none}
.portrait .toc-note{bottom:auto;right:auto}
.portrait .toc-note{position:static;text-align:center;margin-top:8cqw;font-size:2.6cqw}
@keyframes tocDropP{0%{opacity:0;transform:translateY(-60cqw) rotate(calc(var(--r) * 7)) scale(1.3)}55%{opacity:1}100%{opacity:1;transform:none}}
.portrait .pg-toc.play .toc-list li{animation-name:tocDropP}
html.reduced .scene{height:auto}
html.reduced .sc-pin{position:relative;height:100vh}
@media (max-width:760px){.tr{gap:16px}.ptt{display:none}.brand{font-size:21px}}
@media (prefers-reduced-motion:reduce){
  .hint b,.l-name .c{animation:none!important;opacity:1;transform:none;filter:none}
  #ix,.l-half,.l-content,.roll .r,.ix-list li,.ix-thumb,#totop,.hot::after{transition:none!important}
  #chflash{display:none}
}

<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById("data").textContent), P=D.pages, C=D.chapters, N=P.length;
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return [].slice.call((r||document).querySelectorAll(s))}
function pad(n){return n<10?"0"+n:""+n}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function chapterOf(i){for(var k=0;k<C.length;k++)if(i>=C[k].start&&i<=C[k].end)return C[k];return C[0]}
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}
var root=document.documentElement;
var reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
var fine=matchMedia("(hover: hover) and (pointer: fine)").matches;
var mqP=matchMedia("(max-aspect-ratio: 1/1)");
root.classList.add(fine?"fine":"coarse");
if(reduced)root.classList.add("reduced");
var SC=window.Scenes||null;
if(SC)SC.init(JSON.parse(document.getElementById("scene-data").textContent));
var ST=window.Studios||null; if(ST)ST.init();

var secs=$$(".pg"), frames=secs.map(function(s){return $(".frame",s)}), arts=secs.map(function(s){return $(".art",s)});
var isTitle=secs.map(function(s){return s.classList.contains("ch-start")});
var toc=$(".pg-toc");
var tops=[], hs=[], cur=0, ready=false, idxOpen=false, portrait=false;

function layout(){portrait=mqP.matches;root.classList.toggle("portrait",portrait);measure();if(portrait)startRows()}
function measure(){var y=pageYOffset;tops=secs.map(function(s){return s.getBoundingClientRect().top+y});hs=secs.map(function(s){return s.offsetHeight});if(SC)SC.measure()}
function startRows(){secs.forEach(function(s){var x=+s.dataset.x||0;s.scrollLeft=(s.scrollWidth-s.clientWidth)*x})}
function maxY(){return document.documentElement.scrollHeight-innerHeight}
layout();

/* ---------- loader: letters write in, then the screen splits open ---------- */
var lname=$("#lname");
lname.innerHTML=lname.textContent.split("").map(function(ch,k){
  return ch===" "?" ":'<span class="c" style="--i:'+k+'">'+ch.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</span>";
}).join("");
lname.classList.add("split");
var lcount=$("#lcount"), lline=$("#lline"), shown=0, target=0, t0=performance.now();
var first=secs.slice(0,2).map(function(s){return $("img",s)});
function progress(){target=Math.max(target,first.filter(function(im){return im.complete&&im.naturalWidth}).length/first.length*100)}
first.forEach(function(im){im.addEventListener("load",progress);im.addEventListener("error",progress)});
progress();
var minShow=reduced?0:1700;
(function count(){
  shown+=(target-shown)*0.1+0.3; if(shown>target)shown=target;
  lcount.textContent=pad(Math.min(99,Math.round(shown))); lline.style.width=shown+"%";
  var t=performance.now()-t0;
  if((shown>=99.5&&t>minShow)||t>6000){lcount.textContent="100";lline.style.width="100%";setTimeout(start,reduced?0:250);return}
  requestAnimationFrame(count);
})();
function start(){
  if(ready)return; ready=true;
  var L=$("#loader"); L.classList.add("out"); setTimeout(function(){L.remove()},reduced?0:1500);
  root.classList.remove("loading");
  measure();
  var m=/^#p(\d+)$/.exec(location.hash), n=m?clamp(+m[1],1,N):1;
  if(n>1)goTo(n,true);
  onScroll(true);
  if(portrait&&!ss("swiped"))setTimeout(function(){toast("Swipe sideways to read each page · hold to magnify",4200)},1600);
}

/* ---------- smooth scrolling (mouse & trackpad) + gliding page jumps ---------- */
var sy=0, sTarget=0, mode=0, tw=null, running=false;
function smoothOn(){return fine&&!reduced&&!portrait}
function steady(k){var a=.12,d=2*a*(1-a);return k<a?k*k/d:k>1-a?1-(1-k)*(1-k)/d:(k-a/2)/(1-a)}
function ease(k){return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2}
function wheelScroll(d){
  if(mode===0)sy=pageYOffset;
  if(mode!==1)sTarget=sy;
  mode=1; sTarget=clamp(sTarget+d,0,maxY()); run();
}
function tweenTo(y,dur,scenic){
  y=clamp(y,0,maxY()); sy=pageYOffset;
  var nsc=(SC&&scenic)?SC.between(sy,y):0;
  tw={from:sy,to:y,t0:performance.now(),dur:dur||(clamp(500+Math.abs(y-sy)*0.12,650,1400)+nsc*4600),sine:nsc>0}; mode=2; run();
}
function run(){if(!running){running=true;requestAnimationFrame(stepS)}}
function stepS(){
  if(mode===1){sy+=(sTarget-sy)*0.1; if(Math.abs(sTarget-sy)<0.5){sy=sTarget;mode=0}}
  else if(mode===2){var k=Math.min(1,(performance.now()-tw.t0)/tw.dur); sy=tw.from+(tw.to-tw.from)*(tw.sine?steady(k):ease(k)); if(k>=1)mode=0}
  window.scrollTo(0,sy);
  if(mode!==0)requestAnimationFrame(stepS); else running=false;
}
addEventListener("mousedown",function(e){if(e.clientX>=document.documentElement.clientWidth)mode=0},{passive:true}); /* grabbing the scrollbar */
function normDelta(e){return e.deltaY*(e.deltaMode===1?32:e.deltaMode===2?innerHeight:1)}

function targetFor(i){
  if(i<=1)return 0;
  if(portrait)return tops[i-1];
  return tops[i-1]+hs[i-1]/2-innerHeight/2;   /* centre the page on screen */
}
function goTo(i,instant,scenic){
  i=clamp(i,1,N); measure(); loupeOn=false;
  var y=clamp(targetFor(i),0,maxY());
  if(instant){mode=0;window.scrollTo(0,y)}
  else if(smoothOn())tweenTo(y,scenic?0:clamp(500+Math.abs(y-pageYOffset)*0.05,600,1300),scenic);
  else window.scrollTo({top:y,behavior:reduced?"auto":"smooth"});
}
function step(d){goTo((cur||1)+d,false,true)}

/* ---------- current page, labels, rail, progress, project flash, finale ---------- */
var curn=$("#curn"), bar=$("#bar"), hint=$("#hint"), ticks=$$(".tick"), tip=$("#tip"), totop=$("#totop");
function roll(el,text){
  var old=$(".r:not(.leave)",el); if(old&&old.textContent===text)return;
  var nu=document.createElement("span"); nu.className="r"; nu.textContent=text;
  if(reduced||!old){el.textContent="";el.appendChild(nu);return}
  nu.style.transform="translateY(110%)"; el.appendChild(nu); old.classList.add("leave");
  requestAnimationFrame(function(){requestAnimationFrame(function(){old.style.transform="translateY(-110%)";nu.style.transform="none"})});
  setTimeout(function(){old.remove()},750);
}
var hashT=null, flashT=null, lastCh=null, cf=$("#chflash");
function flash(ch){
  if(reduced||ch.id==="intro")return;
  var k=C.indexOf(ch);
  $("#cfNum").textContent=ch.id==="thanks"?"":pad(k)+" / "+pad(C.length-2);
  $("#cfTitle").textContent=ch.title; $("#cfSub").textContent=ch.sub;
  cf.classList.remove("on"); void cf.offsetWidth; cf.classList.add("on");
}
function setCur(i){
  if(i===cur)return; cur=i;
  curn.textContent=pad(i);
  var ch=chapterOf(i);
  roll($("#chName"),ch.title);
  ticks.forEach(function(t,k){t.classList.toggle("on",k===i-1)});
  lastCh=ch;
  if(i===N){$("#p45").classList.add("finale");totop.classList.add("show")}
  clearTimeout(hashT); hashT=setTimeout(function(){try{history.replaceState(null,"",i===1?location.pathname:"#p"+i)}catch(e){}},250);
}
var ticking=false, curLbl=null, extras=$$("[data-after]");
function onScroll(force){
  if(ticking&&!force)return; ticking=true;
  requestAnimationFrame(function(){
    ticking=false;
    var y=pageYOffset, mid=y+innerHeight/2, best=1, bd=1e9;
    for(var k=0;k<tops.length;k++){var d=Math.abs(tops[k]+hs[k]/2-mid);if(d<bd){bd=d;best=k+1}}
    var extra=null;
    for(var q=0;q<extras.length;q++){var r=extras[q].getBoundingClientRect();if(r.top<=innerHeight/2&&r.bottom>=innerHeight/2){extra=extras[q];break}}
    if(extra)best=+extra.dataset.after;
    if(y>=maxY()-2)best=N;
    setCur(best);
    var lbl=extra?extra.dataset.title:(P[cur-1]===chapterOf(cur).title?"":P[cur-1]);
    if(lbl!==curLbl){curLbl=lbl;roll($("#pgTitle"),lbl)}
    var mx_=maxY(); bar.style.transform="scaleX("+(mx_>0?y/mx_:0)+")";
    hint.classList.toggle("gone",y>40);
    if(toc&&!toc.classList.contains("play")){var tr=toc.getBoundingClientRect();if(tr.top<innerHeight*.8&&tr.bottom>innerHeight*.2)toc.classList.add("play")}
  });
}
addEventListener("scroll",function(){onScroll()},{passive:true});

/* ---------- gentle zoom on every page + parallax on project title pages ---------- */
var fxState=[];
function fx(){
  var vh=innerHeight, y=pageYOffset, mid=y+vh/2;
  for(var k=0;k<secs.length;k++){
    var top=tops[k], h=hs[k];
    if(top+h<y-80||top>y+vh+80){continue}
    var p=clamp((top+h/2-mid)/((vh+h)/2),-1,1), a=Math.abs(p);
    var fs=1-0.05*a*a;                                   /* card settles to full size at the centre */
    var t=isTitle[k]?"translate3d(0,"+(-p*2.6).toFixed(3)+"%,0) scale(1.06)"   /* artwork drifts slower */
                     :"scale("+(1+0.07*a).toFixed(4)+")";                       /* content settles from slightly enlarged */
    var key=fs.toFixed(4)+t;
    if(fxState[k]!==key){fxState[k]=key;frames[k].style.transform="scale("+fs.toFixed(4)+")";arts[k].style.transform=t}
  }
}

/* ---------- rail ---------- */
ticks.forEach(function(t,k){
  t.addEventListener("mouseenter",function(){
    tip.textContent=pad(k+1)+"  "+chapterOf(k+1).title+" — "+P[k];
    tip.style.top=(t.offsetTop+t.offsetHeight/2)+"px"; tip.classList.add("on");
  });
  t.addEventListener("mouseleave",function(){tip.classList.remove("on")});
});
$("#prev").addEventListener("click",function(){step(-1)});
$("#next").addEventListener("click",function(){step(1)});
totop.addEventListener("click",function(){goTo(1)});
$$("[data-go]").forEach(function(el){
  el.addEventListener("click",function(e){e.preventDefault();var n=+el.dataset.go;
    if(idxOpen){closeIndex();goTo(n,true);lastCh=null;setTimeout(function(){flash(chapterOf(n))},380)}else goTo(n)});
});

/* ---------- index overlay (thumbnails tilt in 3D with the mouse) ---------- */
var ix=$("#ix"), ixBtn=$("#ixBtn");
function openIndex(){
  if(idxOpen)return; idxOpen=true; loupeOn=false; mode=0;
  $$(".ix-thumb img",ix).forEach(function(im,k){if(!im.getAttribute("src"))im.src=im.dataset.src;im.closest("li").style.setProperty("--d",(k*0.05)+"s")});
  var r=ixBtn.getBoundingClientRect();
  ix.style.setProperty("--cx",(r.left+r.width/2)+"px"); ix.style.setProperty("--cy",(r.top+r.height/2)+"px");
  ix.hidden=false; ix.scrollTop=0; root.classList.add("ix-open"); ixBtn.setAttribute("aria-expanded","true");
  requestAnimationFrame(function(){requestAnimationFrame(function(){ix.classList.add("open")})});
  setTimeout(function(){$("#ixClose").focus({preventScroll:true})},50);
}
function closeIndex(){
  if(!idxOpen)return; idxOpen=false;
  ix.classList.add("closing"); ix.classList.remove("open");
  root.classList.remove("ix-open"); ixBtn.setAttribute("aria-expanded","false");
  setTimeout(function(){ix.classList.remove("closing");ix.hidden=true},reduced?0:900);
}
ixBtn.addEventListener("click",openIndex);
$("#ixClose").addEventListener("click",function(){closeIndex();ixBtn.focus({preventScroll:true})});
if(fine&&!reduced)$$(".ix-thumb",ix).forEach(function(t){
  t.addEventListener("mousemove",function(e){
    var r=t.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
    t.classList.add("tilting");
    t.style.transform="perspective(900px) rotateX("+((0.5-y)*11).toFixed(2)+"deg) rotateY("+((x-0.5)*15).toFixed(2)+"deg) scale(1.035)";
    t.style.setProperty("--sx",(x*100)+"%"); t.style.setProperty("--sy",(y*100)+"%");
  });
  t.addEventListener("mouseleave",function(){t.classList.remove("tilting");t.style.transform=""});
});

/* ---------- keyboard ---------- */
addEventListener("keydown",function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(idxOpen){if(e.key==="Escape"){e.preventDefault();closeIndex();ixBtn.focus({preventScroll:true})}return}
  if(window.__lbxOpen&&__lbxOpen())return;
  if(!ready)return;
  var tag=(e.target.tagName||"").toLowerCase(), onCtl=(tag==="button"||tag==="a");
  switch(e.key){
    case "ArrowDown":case "ArrowRight":case "PageDown":case "j":e.preventDefault();step(1);break;
    case "ArrowUp":case "ArrowLeft":case "PageUp":case "k":e.preventDefault();step(-1);break;
    case " ":if(onCtl)return;e.preventDefault();step(e.shiftKey?-1:1);break;
    case "Home":e.preventDefault();goTo(1);break;
    case "End":e.preventDefault();goTo(N);break;
    case "i":case "I":openIndex();break;
    case "Escape":loupeOn=false;break;
    case "+":case "=":setZoom(zoom+0.5);break;
    case "-":case "_":setZoom(zoom-0.5);break;
  }
});

/* ---------- toast + email hotspots ---------- */
var toastEl=$("#toast"), tT=null;
function toast(msg,ms){toastEl.textContent=msg;toastEl.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){toastEl.classList.remove("on")},ms||2600)}
$$(".hot[data-copy]").forEach(function(a){
  a.addEventListener("click",function(e){
    var addr=a.dataset.copy;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      e.preventDefault();
      navigator.clipboard.writeText(addr).then(function(){toast(addr+" — copied")},function(){location.href="mailto:"+addr});
    }
  });
});

/* ---------- magnifier (wobbles as it moves; the scroll wheel zooms while it is open) ---------- */
var loupe=$("#loupe"), loupeOn=false, inPage=null, mx=-500, my=-500, pmx=-500, pmy=-500, vx=0, vy=0, zoom=2.5, loupeS=0, xlWarm={};
function xl(n){return "img/xl/"+pad(n)+".webp"}
function std(n){return "img/"+pad(n)+".webp"}
function setLoupeImage(pg){
  var n=+pg.dataset.i; if(+loupe.dataset.n===n)return; loupe.dataset.n=n;
  loupe.style.backgroundImage='url("'+xl(n)+'"),url("'+std(n)+'")';
  if(!xlWarm[n]){xlWarm[n]=1;var im=new Image();im.src=xl(n)}
}
var zT=null;
function setZoom(z){
  zoom=clamp(z,1.5,6);
  loupe.dataset.z=zoom.toFixed(1)+"×"; loupe.classList.add("zshow");
  clearTimeout(zT); zT=setTimeout(function(){loupe.classList.remove("zshow")},900);
}
function paintLoupe(){
  var want=(loupeOn&&inPage)?1:0;
  loupeS+=(want-loupeS)*(reduced?1:0.2);
  vx+=((mx-pmx)-vx)*0.25; vy+=((my-pmy)-vy)*0.25; pmx=mx; pmy=my;
  if(loupeS>0.02&&inPage){
    var size=loupe.offsetWidth, half=size/2;
    var r=$(".art",inPage).getBoundingClientRect(), bw=r.width*zoom, bh=r.height*zoom;
    var px=(mx-r.left)/r.width*bw, py=(my-r.top)/r.height*bh;
    var oy=fine?0:-(half+48);
    var sp=Math.hypot(vx,vy), st=reduced?0:Math.min(0.16,sp*0.0045), ang=Math.atan2(vy,vx)*57.2958;
    loupe.style.backgroundSize=bw+"px "+bh+"px";
    loupe.style.backgroundPosition=(half-px)+"px "+(half-py)+"px";
    loupe.style.opacity=Math.min(1,loupeS*1.6);
    loupe.style.transform="translate3d("+mx+"px,"+(my+oy)+"px,0) translate(-50%,-50%) rotate("+ang+"deg) scale("+(1+st)+","+(1-st*0.7)+") rotate("+(-ang)+"deg) scale("+(0.35+0.65*loupeS)+") rotate("+((1-loupeS)*-12)+"deg)";
  }else loupe.style.opacity=0;
}

/* one wheel handler: zoom the lens when it is open, otherwise smooth-scroll */
addEventListener("wheel",function(e){
  if(idxOpen||!ready||(window.__lbxOpen&&__lbxOpen()))return;
  if(loupeOn&&inPage&&!e.ctrlKey){e.preventDefault();setZoom(zoom*Math.exp(-clamp(normDelta(e),-120,120)*0.0011));return}
  if(!smoothOn()||e.ctrlKey)return;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY))return;
  e.preventDefault(); wheelScroll(normDelta(e));
},{passive:false});

if(fine){
  var cdot=$("#cdot"), cring=$("#cring"), clbl=$("span",cring), rx=-500, ry=-500, seen=false, hinted=false, mag=null, press=1, pressT=1;
  var SIZES={none:40,page:84,link:70,btn:62};
  addEventListener("mousemove",function(e){
    mx=e.clientX;my=e.clientY;
    if(!seen){seen=true;rx=pmx=mx;ry=pmy=my;cdot.classList.add("on");cring.classList.add("on")}
  },{passive:true});
  addEventListener("mousedown",function(){pressT=0.78},{passive:true});
  addEventListener("mouseup",function(){pressT=1},{passive:true});
  root.addEventListener("mouseleave",function(){cdot.classList.remove("on");cring.classList.remove("on")});
  root.addEventListener("mouseenter",function(){if(seen){cdot.classList.add("on");cring.classList.add("on")}});
  function ringFor(target){
    var t=target&&target.closest?target.closest("[data-cur]"):null;
    var pg=target&&target.closest?target.closest(".pg"):null;
    var kind=t?t.dataset.cur:((pg&&!pg.classList.contains("pg-toc"))?"page":"none");
    mag=(t&&t.hasAttribute("data-mag"))?t:null;
    var size=SIZES[kind]||40;
    if(mag){var r=mag.getBoundingClientRect();size=Math.max(r.width,r.height)+14}
    cring.style.setProperty("--rs",size+"px");
    cring.style.borderRadius=(mag&&mag.offsetWidth>mag.offsetHeight*1.6)?"999px":"50%";
    if(mag){cring.style.width=(mag.getBoundingClientRect().width+14)+"px";cring.style.height=(mag.getBoundingClientRect().height+14)+"px"}
    else{cring.style.width="";cring.style.height=""}
    var label=mag?"":(t&&t.dataset.label)?t.dataset.label:(kind==="page"&&!loupeOn)?"Zoom":"";
    clbl.textContent=label; cring.classList.toggle("lbl",!!label);
    inPage=(pg&&!target.closest(".hot")&&!pg.classList.contains("pg-toc"))?pg:null;
    return pg;
  }
  document.addEventListener("mouseover",function(e){
    var pg=ringFor(e.target);
    if(pg&&!hinted&&ready&&!idxOpen){hinted=true;setTimeout(function(){toast("Click a page to magnify · scroll to zoom in · click again to close",4200)},500)}
    if(loupeOn&&inPage)setLoupeImage(inPage);
  });
  document.addEventListener("click",function(e){
    if(!ready||idxOpen)return;
    var pg=e.target.closest(".pg"); if(!pg||e.target.closest(".hot")||pg.classList.contains("pg-toc"))return;
    loupeOn=!loupeOn; inPage=pg; mode=0;
    if(loupeOn)setLoupeImage(pg);
    ringFor(e.target);
  });
  (function tick(){
    var tx=mx, ty=my;
    if(mag){var r=mag.getBoundingClientRect();tx=r.left+r.width/2+(mx-(r.left+r.width/2))*0.15;ty=r.top+r.height/2+(my-(r.top+r.height/2))*0.15}
    rx+=(tx-rx)*0.2; ry+=(ty-ry)*0.2; press+=(pressT-press)*0.3;
    cdot.style.transform="translate3d("+mx+"px,"+my+"px,0) translate(-50%,-50%)";
    cring.style.transform="translate3d("+rx+"px,"+ry+"px,0) translate(-50%,-50%) scale("+press.toFixed(3)+")";
    var lensOn=loupeOn&&!!inPage;
    cring.classList.toggle("hide",lensOn); cdot.style.opacity=lensOn?0:"";
    paintLoupe(); if(!reduced)fx(); if(SC)SC.frame(pageYOffset,innerHeight,reduced); if(ST)ST.frame(pageYOffset,innerHeight);
    requestAnimationFrame(tick);
  })();
}else{
  /* touch: press and hold a page to magnify, slide to move the lens, lift to close */
  var holdT=null, sx=0, sy0=0, holding=false;
  document.addEventListener("touchstart",function(e){
    if(!ready||idxOpen||e.touches.length>1)return;
    var pg=e.target.closest(".pg"); if(!pg||e.target.closest(".hot")||pg.classList.contains("pg-toc"))return;
    var t=e.touches[0]; sx=mx=pmx=t.clientX; sy0=my=pmy=t.clientY;
    clearTimeout(holdT);
    holdT=setTimeout(function(){
      holding=true; loupeOn=true; inPage=pg; zoom=2.5; setLoupeImage(pg);
      if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}
    },320);
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    var t=e.touches[0]; if(!t)return;
    if(holding){e.preventDefault(); mx=t.clientX; my=t.clientY; return}
    if(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy0)>8)clearTimeout(holdT);
  },{passive:false});
  function endHold(){clearTimeout(holdT); if(holding){holding=false;loupeOn=false;ss("swiped","1")}}
  document.addEventListener("touchend",endHold);
  document.addEventListener("touchcancel",endHold);
  document.addEventListener("contextmenu",function(e){if(e.target.closest(".pg"))e.preventDefault()});
  secs.forEach(function(s){s.addEventListener("scroll",function(){ss("swiped","1")},{passive:true,once:true})});
  (function tick(){paintLoupe(); if(!reduced)fx(); if(SC)SC.frame(pageYOffset,innerHeight,reduced); if(ST)ST.frame(pageYOffset,innerHeight); requestAnimationFrame(tick)})();
}


/* ---------- large view for the print libraries & shoot ---------- */
(function(){
  var box=$("#lbx"), frame=$(".lbx-frame",box), img=$("img",frame), cap=$(".lbx-cap",box), opener=null;
  function open(b){opener=b;img.src=b.dataset.full;img.alt=b.dataset.cap;cap.textContent=b.dataset.cap+(fine?"  ·  click to zoom":"");
    box.classList.add("on");box.setAttribute("aria-hidden","false");root.classList.add("ix-open");loupeOn=false;$(".lbx-close",box).focus({preventScroll:true})}
  function close(){box.classList.remove("on");box.setAttribute("aria-hidden","true");frame.classList.remove("zoom");root.classList.remove("ix-open");if(opener)opener.focus({preventScroll:true})}
  $$(".lib-open").forEach(function(b){b.addEventListener("click",function(e){e.stopPropagation();open(b)})});
  $(".lbx-close",box).addEventListener("click",close);
  box.addEventListener("click",function(e){if(e.target===box)close()});
  frame.addEventListener("click",function(e){e.stopPropagation();frame.classList.toggle("zoom")});
  frame.addEventListener("mousemove",function(e){var r=frame.getBoundingClientRect();frame.style.setProperty("--ox",((e.clientX-r.left)/r.width*100)+"%");frame.style.setProperty("--oy",((e.clientY-r.top)/r.height*100)+"%")});
  addEventListener("keydown",function(e){if(box.classList.contains("on")&&e.key==="Escape"){e.stopImmediatePropagation();close()}},true);
  window.__lbxOpen=function(){return box.classList.contains("on")};
})();
/* ---------- resize ---------- */
var rzT=null;
addEventListener("resize",function(){clearTimeout(rzT);rzT=setTimeout(function(){var i=cur||1;fxState=[];layout();if(ST)ST.resize();if(ready)goTo(i,true)},160)});
addEventListener("load",function(){measure();onScroll(true)});
})();
</script>
